[tool.poetry]
name = "iedit"
version = "0.1.0"
description = "A CLI tool for editing Latex files to improve their form, syntax and grammar."
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "iedit"}]

[tool.poetry.dependencies]
python = "^3.9"
boto3 = "^1.34.0"
typer = "0.12.3"
click = "8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
iedit = "iedit.main:app"
